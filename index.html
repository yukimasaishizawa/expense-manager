<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Manager</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

  <style>
    /* 全体のベース設定（ダークテーマ） */
    body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; background-color: #111827; color: #e5e7eb; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    /* パスワード画面のオーバーレイ */
    #login-overlay { position: fixed; inset: 0; background: #0b0f19; z-index: 9999; display: flex; align-items: center; justify-content: center; }
    
    /* ロード中スピナー（シックな色に） */
    .loader { border: 3px solid #374151; border-top: 3px solid #d4af37; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none;}
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* ダークモード用のスクロールバー */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1f2937; }
    ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <!-- ログイン（パスワード）画面 -->
  <div id="login-overlay">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700 w-full max-w-sm text-center">
      <h1 class="text-2xl font-bold mb-4 text-gray-200"><i class="fa-solid fa-wallet text-amber-500"></i> My 家計簿</h1>
      <p class="text-sm text-gray-400 mb-6">アクセスするにはパスワードを入力してください</p>
      <input type="password" id="password-input" class="w-full bg-gray-900 border border-gray-600 text-white p-3 rounded-lg mb-4 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all" placeholder="パスワード">
      <button onclick="checkPassword()" class="w-full bg-amber-600 text-white p-3 rounded-lg font-bold hover:bg-amber-500 transition-all shadow-lg shadow-amber-900/50">ログイン</button>
      <p id="login-error" class="text-rose-400 text-sm mt-3 hidden"><i class="fa-solid fa-circle-exclamation"></i> パスワードが違います</p>
    </div>
  </div>

  <!-- アプリケーション本体 -->
  <div id="app-container" class="hidden flex-1 flex flex-col h-full">
    
    <!-- ヘッダー -->
    <header class="bg-gray-900 text-gray-200 p-4 border-b border-gray-800 flex justify-between items-center shrink-0">
      <h1 class="text-lg font-bold tracking-wider"><i class="fa-solid fa-wallet text-amber-500 mr-2"></i>Expense Manager</h1>
      <div class="text-xs text-gray-400 uppercase tracking-widest">Personal</div>
    </header>

    <!-- メインコンテンツ領域 (しっかりスクロールできるように pb-28 を設定) -->
    <main class="flex-1 overflow-y-auto p-4 md:p-6 pb-28">
      
      <!-- タブ1: ダッシュボード (1画面に収まりやすいよう高さを調整) -->
      <section id="tab-dashboard" class="tab-content active space-y-4 max-w-4xl mx-auto">
        
        <!-- 上段：サマリーカード -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- 予算進捗カード -->
          <div class="bg-gray-800 p-5 rounded-2xl shadow-lg border border-gray-700 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-1 h-full bg-amber-500"></div>
            <h2 class="text-sm font-semibold text-gray-400 mb-1 uppercase tracking-wider">今月の予算進捗</h2>
            <div class="flex justify-between items-end mb-3">
              <span class="text-3xl font-bold text-gray-100 font-mono" id="dashboard-spent">¥0</span>
              <span class="text-gray-500 text-sm">/ <span id="dashboard-budget">¥0</span></span>
            </div>
            <div class="w-full bg-gray-900 rounded-full h-2.5 mb-1">
              <div id="budget-progress-bar" class="bg-amber-500 h-2.5 rounded-full transition-all duration-1000 ease-out" style="width: 0%"></div>
            </div>
            <p id="budget-percent-text" class="text-right text-xs text-gray-400 font-mono">0%</p>
          </div>
          
          <!-- 収支バランスカード -->
          <div class="bg-gray-800 p-5 rounded-2xl shadow-lg border border-gray-700 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
            <h2 class="text-sm font-semibold text-gray-400 mb-3 uppercase tracking-wider">今月の収支</h2>
            <div class="flex justify-between items-center">
              <div>
                <p class="text-xs text-gray-500 mb-1">収入</p>
                <p class="text-xl font-bold text-emerald-400 font-mono" id="dashboard-income">¥0</p>
              </div>
              <div class="h-8 w-px bg-gray-700"></div>
              <div class="text-right">
                <p class="text-xs text-gray-500 mb-1">支出</p>
                <p class="text-xl font-bold text-rose-400 font-mono" id="dashboard-expense">¥0</p>
              </div>
            </div>
          </div>
        </div>

        <!-- 下段：グラフ領域 (高さを抑える) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-gray-800 p-4 rounded-2xl shadow-lg border border-gray-700">
            <h3 class="text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider text-center">カテゴリ別支出</h3>
            <div class="relative h-48 w-full"><canvas id="pieChart"></canvas></div>
          </div>
          <div class="bg-gray-800 p-4 rounded-2xl shadow-lg border border-gray-700">
            <h3 class="text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider text-center">月別支出推移 (直近6ヶ月)</h3>
            <div class="relative h-48 w-full"><canvas id="lineChart"></canvas></div>
          </div>
        </div>
      </section>

      <!-- タブ2: 入出金登録 -->
      <section id="tab-input" class="tab-content max-w-lg mx-auto">
        <div class="bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-700">
          <h2 class="text-lg font-bold text-gray-200 mb-5 border-b border-gray-700 pb-2"><i class="fa-solid fa-pen-nib text-amber-500 mr-2"></i>取引の登録</h2>
          
          <!-- OCR機能 -->
          <div class="mb-6 p-4 bg-gray-900 rounded-xl border border-gray-700">
            <label class="block text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider"><i class="fa-solid fa-camera mr-1"></i> レシート読取</label>
            
            <div class="flex gap-2 mb-3">
              <!-- カメラで直接撮影 -->
              <label class="flex-1 text-center bg-gray-800 border border-gray-600 text-amber-500 py-2 rounded-lg shadow hover:bg-gray-700 cursor-pointer text-sm font-semibold transition-colors">
                <i class="fa-solid fa-camera mr-1"></i> カメラ起動
                <input type="file" id="receipt-camera" accept="image/*" capture="environment" class="hidden" onchange="handleFileSelect(this)">
              </label>
              
              <!-- ギャラリーから写真を選択 -->
              <label class="flex-1 text-center bg-gray-800 border border-gray-600 text-amber-500 py-2 rounded-lg shadow hover:bg-gray-700 cursor-pointer text-sm font-semibold transition-colors">
                <i class="fa-solid fa-image mr-1"></i> 写真から
                <input type="file" id="receipt-upload" accept="image/*" class="hidden" onchange="handleFileSelect(this)">
              </label>
            </div>
            
            <!-- 選択されたファイル名を表示する領域 -->
            <div id="selected-file-name" class="text-xs text-gray-400 mb-3 text-center hidden"></div>

            <button onclick="processOCR()" class="w-full bg-gray-800 border border-gray-600 text-gray-300 px-4 py-2 rounded-lg shadow hover:bg-gray-700 flex justify-center items-center gap-2 transition-colors">
              自動入力する <div id="ocr-loader" class="loader"></div>
            </button>
          </div>

          <form id="transaction-form" class="space-y-5">
            <input type="hidden" id="edit-id">
            
            <!-- 収支トグル -->
            <div class="flex gap-3">
              <label class="flex-1 cursor-pointer">
                <input type="radio" name="type" value="expense" checked class="peer sr-only" onchange="toggleFormMode()">
                <div class="py-2 text-center rounded-lg border border-gray-600 bg-gray-900 text-gray-400 peer-checked:bg-rose-900/30 peer-checked:text-rose-400 peer-checked:border-rose-500 transition-all text-sm font-bold">支出</div>
              </label>
              <label class="flex-1 cursor-pointer">
                <input type="radio" name="type" value="income" class="peer sr-only" onchange="toggleFormMode()">
                <div class="py-2 text-center rounded-lg border border-gray-600 bg-gray-900 text-gray-400 peer-checked:bg-emerald-900/30 peer-checked:text-emerald-400 peer-checked:border-emerald-500 transition-all text-sm font-bold">収入</div>
              </label>
              <label class="flex-1 cursor-pointer">
                <input type="radio" name="type" value="transfer" class="peer sr-only" onchange="toggleFormMode()">
                <div class="py-2 text-center rounded-lg border border-gray-600 bg-gray-900 text-gray-400 peer-checked:bg-blue-900/30 peer-checked:text-blue-400 peer-checked:border-blue-500 transition-all text-sm font-bold">移動</div>
              </label>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="text-xs font-semibold text-gray-400 uppercase">日付</label>
                <input type="date" id="input-date" class="w-full bg-gray-900 border border-gray-700 text-white p-2.5 rounded-lg mt-1 focus:ring-1 focus:ring-amber-500 focus:outline-none" required>
              </div>
              <div>
                <label class="text-xs font-semibold text-gray-400 uppercase">金額 (¥)</label>
                <input type="number" id="input-amount" class="w-full bg-gray-900 border border-gray-700 text-white p-2.5 rounded-lg mt-1 focus:ring-1 focus:ring-amber-500 focus:outline-none font-mono" required>
              </div>
            </div>
            
            <!-- 通常の支出・収入用の入力項目 -->
            <div id="normal-fields" class="grid grid-cols-2 gap-4">
              <div>
                <label class="text-xs font-semibold text-gray-400 uppercase">アカウント</label>
                <select id="input-account" class="w-full bg-gray-900 border border-gray-700 text-white p-2.5 rounded-lg mt-1 focus:ring-1 focus:ring-amber-500 focus:outline-none"></select>
              </div>
              <div>
                <label class="text-xs font-semibold text-gray-400 uppercase">カテゴリ</label>
                <select id="input-category" class="w-full bg-gray-900 border border-gray-700 text-white p-2.5 rounded-lg mt-1 focus:ring-1 focus:ring-amber-500 focus:outline-none">
                  <option value="食費">食費</option>
                  <option value="交通費">交通費</option>
                  <option value="日用品">日用品</option>
                  <option value="交際費">交際費</option>
                  <option value="住居費">住居費</option>
                  <option value="給料">給料</option>
                  <option value="その他">その他</option>
                </select>
              </div>
            </div>

            <!-- 移動用の入力項目 -->
            <div id="transfer-fields" class="grid grid-cols-2 gap-4 hidden">
              <div>
                <label class="text-xs font-semibold text-gray-400 uppercase text-rose-400">移動元 (マイナス)</label>
                <select id="transfer-from" class="w-full bg-gray-900 border border-gray-700 text-white p-2.5 rounded-lg mt-1 focus:ring-1 focus:ring-blue-500 focus:outline-none"></select>
              </div>
              <div>
                <label class="text-xs font-semibold text-gray-400 uppercase text-emerald-400">移動先 (プラス)</label>
                <select id="transfer-to" class="w-full bg-gray-900 border border-gray-700 text-white p-2.5 rounded-lg mt-1 focus:ring-1 focus:ring-blue-500 focus:outline-none"></select>
              </div>
            </div>

            <div>
              <label class="text-xs font-semibold text-gray-400 uppercase">メモ</label>
              <input type="text" id="input-memo" class="w-full bg-gray-900 border border-gray-700 text-white p-2.5 rounded-lg mt-1 focus:ring-1 focus:ring-amber-500 focus:outline-none placeholder-gray-600" placeholder="詳細を入力...">
            </div>
            
            <div class="pt-2">
              <button type="submit" class="w-full bg-amber-600 text-white font-bold py-3 rounded-lg shadow-lg shadow-amber-900/30 hover:bg-amber-500 transition-all">保存する</button>
              <button type="button" id="cancel-edit-btn" onclick="cancelEdit()" class="w-full bg-gray-700 text-gray-300 font-bold py-3 rounded-lg shadow hidden mt-3 hover:bg-gray-600 transition-all">修正をキャンセル</button>
            </div>
          </form>

        </div>
      </section>

      <!-- タブ3: 履歴確認 -->
      <section id="tab-history" class="tab-content max-w-4xl mx-auto">
        <div class="bg-gray-800 p-5 rounded-2xl shadow-lg border border-gray-700 overflow-hidden">
          <h2 class="text-lg font-bold text-gray-200 mb-4 border-b border-gray-700 pb-2"><i class="fa-solid fa-clock-rotate-left text-amber-500 mr-2"></i>取引履歴</h2>
          <div class="overflow-x-auto">
            <table class="w-full text-left min-w-[500px]">
              <thead>
                <tr class="bg-gray-900 text-gray-400 text-xs uppercase tracking-wider">
                  <th class="p-3 font-semibold rounded-tl-lg">日付</th>
                  <th class="p-3 font-semibold">項目 / カテゴリ</th>
                  <th class="p-3 font-semibold">金額</th>
                  <th class="p-3 font-semibold text-center rounded-tr-lg">操作</th>
                </tr>
              </thead>
              <tbody id="history-table-body" class="text-sm">
                <!-- JSで動的に追加 -->
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- タブ4: 設定 -->
      <section id="tab-settings" class="tab-content max-w-lg mx-auto space-y-5">
        <div class="bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-700">
          <h2 class="text-lg font-bold text-gray-200 mb-5 border-b border-gray-700 pb-2"><i class="fa-solid fa-sliders text-amber-500 mr-2"></i>設定</h2>
          
          <div class="mb-6">
            <label class="text-xs font-semibold text-gray-400 uppercase">月間予算 (¥)</label>
            <div class="flex gap-2 mt-2">
              <input type="number" id="setting-budget" class="flex-1 bg-gray-900 border border-gray-700 text-white p-2.5 rounded-lg focus:ring-1 focus:ring-amber-500 focus:outline-none font-mono">
              <button onclick="saveBudget()" class="bg-gray-700 text-white px-5 rounded-lg hover:bg-gray-600 transition-colors font-bold border border-gray-600">保存</button>
            </div>
          </div>

          <div>
            <label class="text-xs font-semibold text-gray-400 uppercase">取引項目アカウント</label>
            <ul id="settings-account-list" class="mt-2 space-y-2 mb-4 border border-gray-700 p-2 rounded-lg bg-gray-900 h-40 overflow-y-auto">
              <!-- 動的に追加 -->
            </ul>
            <div class="flex gap-2">
              <input type="text" id="new-account-name" class="flex-1 bg-gray-900 border border-gray-700 text-white p-2.5 rounded-lg focus:ring-1 focus:ring-amber-500 focus:outline-none" placeholder="新規アカウント名">
              <button onclick="addAccount()" class="bg-indigo-600/80 text-white px-5 rounded-lg hover:bg-indigo-500 transition-colors font-bold"><i class="fa-solid fa-plus"></i></button>
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- ボトムナビゲーション (固定) -->
    <nav class="bg-gray-900 border-t border-gray-800 fixed bottom-0 w-full flex justify-around text-[10px] sm:text-xs font-semibold pb-safe shrink-0 z-50">
      <button onclick="switchTab('dashboard')" class="nav-btn flex-1 py-3 flex flex-col items-center gap-1 text-amber-500 transition-colors">
        <i class="fa-solid fa-chart-line text-lg mb-0.5"></i> ダッシュボード
      </button>
      <button onclick="switchTab('input')" class="nav-btn flex-1 py-3 flex flex-col items-center gap-1 text-gray-500 hover:text-gray-300 transition-colors">
        <i class="fa-solid fa-circle-plus text-lg mb-0.5"></i> 追 加
      </button>
      <button onclick="switchTab('history')" class="nav-btn flex-1 py-3 flex flex-col items-center gap-1 text-gray-500 hover:text-gray-300 transition-colors">
        <i class="fa-solid fa-clock-rotate-left text-lg mb-0.5"></i> 履 歴
      </button>
      <button onclick="switchTab('settings')" class="nav-btn flex-1 py-3 flex flex-col items-center gap-1 text-gray-500 hover:text-gray-300 transition-colors">
        <i class="fa-solid fa-sliders text-lg mb-0.5"></i> 設 定
      </button>
    </nav>
  </div>

  <!-- 🔽🔽🔽 JavaScript 実装部 🔽🔽🔽 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️【重要】Firebaseの設定情報
    const firebaseConfig = {
      apiKey: "AIzaSyDg5hFUvFsOPBlKscpirX0fEw188kLgifk",
      authDomain: "expense-manager-4e7ca.firebaseapp.com",
      projectId: "expense-manager-4e7ca",
      storageBucket: "expense-manager-4e7ca.firebasestorage.app",
      messagingSenderId: "34872948180",
      appId: "1:34872948180:web:34b2aed5b0ba99b09c9241",
      measurementId: "G-M6J57T5LRQ"
    };
    
    let db;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    } catch(e) {
      console.warn("Firebase未設定です。ローカルの動作テストモードで動かします。");
      db = null; 
    }

    let transactions = [];
    let accounts = ["現金", "銀行", "PayPay", "クレジットカード"];
    let monthlyBudget = 100000;
    
    let chartPie = null;
    let chartLine = null;

    // ダークテーマ用 Chart.js グローバル設定
    Chart.defaults.color = '#9ca3af'; 
    Chart.defaults.borderColor = 'rgba(75, 85, 99, 0.3)';
    Chart.defaults.font.family = "Helvetica Neue, Arial, sans-serif";

    window.checkPassword = () => {
      const pwd = document.getElementById("password-input").value;
      if (pwd === "k$9#mX2!vP7&wQ4L") {
        document.getElementById("login-overlay").style.display = "none";
        document.getElementById("app-container").classList.remove("hidden");
        initApp();
      } else {
        document.getElementById("login-error").classList.remove("hidden");
      }
    };

    function initApp() {
      resetInputForm();

      if (!db) { renderUI(); return; }

      // グローバル設定の取得
      onSnapshot(doc(db, "settings", "global"), (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.accounts) accounts = data.accounts;
          if (data.budget) monthlyBudget = data.budget;
        } else {
          setDoc(doc(db, "settings", "global"), { accounts, budget: monthlyBudget })
            .catch(e => console.warn("初期設定の保存に失敗しました:", e));
        }
        renderUI(); // 取得完了後に必ずUIを更新
      }, (error) => {
        console.warn("Firestoreの読み込み権限がないかエラーです:", error);
        renderUI();
      });

      // 取引履歴の取得
      const q = query(collection(db, "transactions"), orderBy("date", "desc"));
      onSnapshot(q, (snapshot) => {
        transactions = [];
        snapshot.forEach((doc) => transactions.push({ id: doc.id, ...doc.data() }));
        renderHistory();
        updateDashboard();
      }, (error) => {
        console.warn("履歴データの取得に失敗しました:", error);
      });
    }

    window.switchTab = (tabId) => {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
      
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-amber-500');
        btn.classList.add('text-gray-500');
      });
      event.currentTarget.classList.remove('text-gray-500');
      event.currentTarget.classList.add('text-amber-500');
    };

    function renderUI() {
      updateSettingsUI();
      updateAccountDropdowns();
      renderHistory();
      updateDashboard();
    }

    // トグルの切り替え制御
    window.toggleFormMode = () => {
      const type = document.querySelector('input[name="type"]:checked').value;
      if (type === 'transfer') {
        document.getElementById('normal-fields').classList.add('hidden');
        document.getElementById('transfer-fields').classList.remove('hidden');
      } else {
        document.getElementById('normal-fields').classList.remove('hidden');
        document.getElementById('transfer-fields').classList.add('hidden');
      }
    };

    // アカウント一覧を全プルダウンに反映
    function updateAccountDropdowns() {
      const selectAcc = document.getElementById('input-account');
      const selectFrom = document.getElementById('transfer-from');
      const selectTo = document.getElementById('transfer-to');
      
      selectAcc.innerHTML = '';
      selectFrom.innerHTML = '';
      selectTo.innerHTML = '';
      
      accounts.forEach(acc => {
        selectAcc.appendChild(new Option(acc, acc));
        selectFrom.appendChild(new Option(acc, acc));
        selectTo.appendChild(new Option(acc, acc));
      });
    }

    // 設定画面のUI更新
    function updateSettingsUI() {
      const budgetInput = document.getElementById('setting-budget');
      if (budgetInput) budgetInput.value = monthlyBudget;
      
      const list = document.getElementById('settings-account-list');
      if (list) {
        list.innerHTML = '';
        accounts.forEach(acc => {
          const li = document.createElement('li');
          li.className = "flex justify-between items-center bg-gray-800 p-2 rounded border border-gray-700";
          li.innerHTML = `
            <span class="text-gray-300 text-sm">${acc}</span>
            <button onclick="deleteAccount('${acc}')" class="text-rose-400 hover:text-rose-300"><i class="fa-solid fa-trash text-xs"></i></button>
          `;
          list.appendChild(li);
        });
      }
    }

    // アカウントの追加
    window.addAccount = async () => {
      const name = document.getElementById('new-account-name').value.trim();
      if (!name) return;
      accounts.push(name);
      document.getElementById('new-account-name').value = '';
      
      try {
        if(db) await setDoc(doc(db, "settings", "global"), { accounts, budget: monthlyBudget });
      } catch (e) {
        console.warn("クラウド保存失敗", e);
      }
      renderUI(); 
    };

    // アカウントの削除
    window.deleteAccount = async (accName) => {
      if (!confirm(`アカウント「${accName}」を削除しますか？`)) return;
      accounts = accounts.filter(a => a !== accName);
      
      try {
        if(db) await setDoc(doc(db, "settings", "global"), { accounts, budget: monthlyBudget });
      } catch (e) {
        console.warn("クラウド保存失敗", e);
      }
      renderUI(); 
    };

    // 予算の保存
    window.saveBudget = async () => {
      const val = parseInt(document.getElementById('setting-budget').value);
      if (isNaN(val)) return;
      monthlyBudget = val;
      
      try {
        if(db) await setDoc(doc(db, "settings", "global"), { accounts, budget: monthlyBudget });
        alert("予算を保存しました");
      } catch (e) {
        console.warn("クラウド保存失敗", e);
      }
      renderUI(); 
    };

    function resetInputForm() {
      document.getElementById('transaction-form').reset();
      document.getElementById('edit-id').value = ''; 
      document.getElementById('input-date').valueAsDate = new Date(); 
      document.querySelector('input[name="type"][value="expense"]').checked = true;
      toggleFormMode(); // 表示を戻す
      
      const accSelect = document.getElementById('input-account');
      if(accSelect.options.length > 0) accSelect.selectedIndex = 0;
      
      const catSelect = document.getElementById('input-category');
      if(catSelect.options.length > 0) catSelect.selectedIndex = 0;

      const fromSelect = document.getElementById('transfer-from');
      if(fromSelect.options.length > 0) fromSelect.selectedIndex = 0;
      
      const toSelect = document.getElementById('transfer-to');
      if(toSelect.options.length > 1) toSelect.selectedIndex = 1; // 別のアカウントを初期選択

      document.getElementById('cancel-edit-btn').classList.add('hidden');
    }

    document.getElementById('transaction-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const editId = document.getElementById('edit-id').value;
      const type = document.querySelector('input[name="type"]:checked').value;
      
      const data = {
        type: type,
        date: document.getElementById('input-date').value,
        amount: parseInt(document.getElementById('input-amount').value),
        memo: document.getElementById('input-memo').value,
        timestamp: new Date().getTime()
      };

      if (type === 'transfer') {
        data.fromAccount = document.getElementById('transfer-from').value;
        data.toAccount = document.getElementById('transfer-to').value;
        if (data.fromAccount === data.toAccount) {
          alert("移動元と移動先が同じです。別のアカウントを選択してください。");
          return;
        }
      } else {
        data.account = document.getElementById('input-account').value;
        data.category = document.getElementById('input-category').value;
      }

      try {
        if(db) {
          if (editId) {
            await updateDoc(doc(db, "transactions", editId), data);
          } else {
            await addDoc(collection(db, "transactions"), data);
          }
        }
        resetInputForm();
        switchTab('dashboard'); 
      } catch (error) {
        console.error(error);
        alert("エラーが発生しました。");
      }
    });

    window.cancelEdit = () => {
      resetInputForm();
    };

    window.deleteTransaction = async (id) => {
      if(!confirm("本当に削除しますか？")) return;
      try {
        if(db) await deleteDoc(doc(db, "transactions", id));
      } catch(error) {
        alert("エラーが発生しました。");
      }
    };

    function renderHistory() {
      const tbody = document.getElementById('history-table-body');
      tbody.innerHTML = '';
      
      transactions.forEach(t => {
        if (t.type === 'transfer') {
          // 移動元 (マイナス行)
          const trFrom = document.createElement('tr');
          trFrom.className = "border-b border-gray-800 hover:bg-gray-800/50 transition-colors bg-blue-900/10";
          trFrom.innerHTML = `
            <td class="p-3 text-gray-300 font-mono text-xs">${t.date.slice(5)}</td>
            <td class="p-3">
              <div class="text-blue-300">資金移動 <span class="text-[10px] bg-rose-500/20 text-rose-300 px-1 rounded">出</span></div>
              <div class="text-[10px] text-gray-500">${t.fromAccount} ${t.memo ? ' '+t.memo : ''}</div>
            </td>
            <td class="p-3 font-bold font-mono text-rose-400">-¥${t.amount.toLocaleString()}</td>
            <td class="p-3 text-center">
              <div class="flex justify-center gap-3">
                <button onclick="editTransaction('${t.id}')" class="text-gray-500 hover:text-indigo-400 transition-colors"><i class="fa-solid fa-pen"></i></button>
                <button onclick="deleteTransaction('${t.id}')" class="text-gray-500 hover:text-rose-400 transition-colors"><i class="fa-solid fa-trash"></i></button>
              </div>
            </td>
          `;
          tbody.appendChild(trFrom);

          // 移動先 (プラス行)
          const trTo = document.createElement('tr');
          trTo.className = "border-b border-gray-800 hover:bg-gray-800/50 transition-colors bg-blue-900/10";
          trTo.innerHTML = `
            <td class="p-3 text-gray-300 font-mono text-xs">${t.date.slice(5)}</td>
            <td class="p-3">
              <div class="text-blue-300">資金移動 <span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-1 rounded">入</span></div>
              <div class="text-[10px] text-gray-500">${t.toAccount} ${t.memo ? ' '+t.memo : ''}</div>
            </td>
            <td class="p-3 font-bold font-mono text-emerald-400">+¥${t.amount.toLocaleString()}</td>
            <td class="p-3 text-center">
              <div class="text-xs text-gray-600"><i class="fa-solid fa-link"></i> 連動</div>
            </td>
          `;
          tbody.appendChild(trTo);

        } else {
          // 通常の支出・収入
          const isEx = t.type === 'expense';
          const tr = document.createElement('tr');
          tr.className = "border-b border-gray-800 hover:bg-gray-800/50 transition-colors";
          tr.innerHTML = `
            <td class="p-3 text-gray-300 font-mono text-xs">${t.date.slice(5)}</td>
            <td class="p-3">
              <div class="text-gray-200">${t.category}</div>
              <div class="text-[10px] text-gray-500">${t.account} ${t.memo ? '- '+t.memo : ''}</div>
            </td>
            <td class="p-3 font-bold font-mono ${isEx ? 'text-rose-400' : 'text-emerald-400'}">
              ${isEx ? '-' : '+'}¥${t.amount.toLocaleString()}
            </td>
            <td class="p-3 text-center">
              <div class="flex justify-center gap-3">
                <button onclick="editTransaction('${t.id}')" class="text-gray-500 hover:text-indigo-400 transition-colors"><i class="fa-solid fa-pen"></i></button>
                <button onclick="deleteTransaction('${t.id}')" class="text-gray-500 hover:text-rose-400 transition-colors"><i class="fa-solid fa-trash"></i></button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        }
      });
    }

    window.editTransaction = (id) => {
      const t = transactions.find(x => x.id === id);
      if(!t) return;
      
      document.getElementById('edit-id').value = t.id;
      document.querySelector(`input[name="type"][value="${t.type}"]`).checked = true;
      toggleFormMode(); // 表示項目の切り替え

      document.getElementById('input-date').value = t.date;
      document.getElementById('input-amount').value = t.amount;
      document.getElementById('input-memo').value = t.memo || '';
      
      if (t.type === 'transfer') {
        document.getElementById('transfer-from').value = t.fromAccount;
        document.getElementById('transfer-to').value = t.toAccount;
      } else {
        document.getElementById('input-account').value = t.account;
        document.getElementById('input-category').value = t.category;
      }
      
      document.getElementById('cancel-edit-btn').classList.remove('hidden');
      switchTab('input');
    };

    function updateDashboard() {
      const now = new Date();
      const currentMonthStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}`;
      
      let thisMonthExpense = 0;
      let thisMonthIncome = 0;
      let categoryData = {}; 

      transactions.forEach(t => {
        if (t.date.startsWith(currentMonthStr)) {
          if (t.type === 'expense') {
            thisMonthExpense += t.amount;
            categoryData[t.category] = (categoryData[t.category] || 0) + t.amount;
          } else if (t.type === 'income') {
            thisMonthIncome += t.amount;
          }
        }
      });

      document.getElementById('dashboard-spent').textContent = `¥${thisMonthExpense.toLocaleString()}`;
      document.getElementById('dashboard-budget').textContent = `¥${monthlyBudget.toLocaleString()}`;
      document.getElementById('dashboard-income').textContent = `¥${thisMonthIncome.toLocaleString()}`;
      document.getElementById('dashboard-expense').textContent = `¥${thisMonthExpense.toLocaleString()}`;

      const percent = Math.min(Math.round((thisMonthExpense / monthlyBudget) * 100), 100) || 0;
      const bar = document.getElementById('budget-progress-bar');
      bar.style.width = `${percent}%`;
      document.getElementById('budget-percent-text').textContent = `${percent}%`;
      
      if(percent >= 100) bar.className = 'h-2.5 rounded-full transition-all duration-1000 ease-out bg-rose-500';
      else if(percent >= 80) bar.className = 'h-2.5 rounded-full transition-all duration-1000 ease-out bg-orange-500';
      else bar.className = 'h-2.5 rounded-full transition-all duration-1000 ease-out bg-amber-500';

      drawPieChart(categoryData);
      drawLineChart();
    }


    // シックなチャートカラーパレット
    const chicColors = ['#d4af37', '#64748b', '#3b82f6', '#10b981', '#6366f1', '#8b5cf6', '#475569'];

    function drawPieChart(catData) {
      const ctx = document.getElementById('pieChart').getContext('2d');
      const labels = Object.keys(catData);
      const data = Object.values(catData);
      
      if (chartPie) chartPie.destroy();
      chartPie = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels.length ? labels : ['データなし'],
          datasets: [{
            data: data.length ? data : [1],
            backgroundColor: labels.length ? chicColors : ['#374151'],
            borderWidth: 0,
            hoverOffset: 4
          }]
        },
        options: { 
          responsive: true, 
          maintainAspectRatio: false,
          cutout: '70%',
          plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: {size: 10} } } }
        }
      });
    }

    function drawLineChart() {
      const monthlyTotals = {};
      for(let i=5; i>=0; i--) {
        let d = new Date();
        d.setMonth(d.getMonth() - i);
        let mStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}`;
        monthlyTotals[mStr] = 0;
      }

      transactions.forEach(t => {
        if(t.type === 'expense' && monthlyTotals[t.date.substring(0,7)] !== undefined) {
          monthlyTotals[t.date.substring(0,7)] += t.amount;
        }
      });

      const ctx = document.getElementById('lineChart').getContext('2d');
      if (chartLine) chartLine.destroy();
      chartLine = new Chart(ctx, {
        type: 'line',
        data: {
          labels: Object.keys(monthlyTotals).map(m => m.substring(5)),
          datasets: [{
            label: '支出',
            data: Object.values(monthlyTotals),
            borderColor: '#d4af37',
            backgroundColor: 'rgba(212, 175, 55, 0.1)',
            borderWidth: 2,
            pointBackgroundColor: '#111827',
            pointBorderColor: '#d4af37',
            fill: true,
            tension: 0.4
          }]
        },
        options: { 
          responsive: true, 
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false } },
            y: { beginAtZero: true, border: { dash: [4, 4] } }
          }
        }
      });
    }

    let selectedFile = null;

    window.handleFileSelect = (input) => {
      if (input.files && input.files.length > 0) {
        selectedFile = input.files[0];
        const nameDisplay = document.getElementById('selected-file-name');
        nameDisplay.textContent = `選択中: ${selectedFile.name}`;
        nameDisplay.classList.remove('hidden');
      }
    };

    window.processOCR = async () => {
      if (!selectedFile) {
        alert("カメラで撮影するか、画像を選択してください。"); 
        return;
      }
      
      const loader = document.getElementById('ocr-loader');
      loader.style.display = 'block';

      try {
        const result = await Tesseract.recognize(selectedFile, 'jpn');
        const text = result.data.text;

        const numRegex = /[0-9,]+/g;
        let amounts = text.match(numRegex) || [];
        amounts = amounts.map(n => parseInt(n.replace(/,/g, ''))).filter(n => !isNaN(n));
        const maxAmount = Math.max(...amounts, 0);

        if (maxAmount > 0) {
          document.getElementById('input-amount').value = maxAmount;
          document.getElementById('input-memo').value = "自動読取 (金額要確認)";
          alert(`¥${maxAmount} を検出しました。\n※必ず内容を確認してください。`);
        } else {
          alert("金額を検出できませんでした。");
        }
      } catch (error) {
        alert("エラーが発生しました。");
      } finally {
        loader.style.display = 'none';
        
        selectedFile = null;
        document.getElementById('selected-file-name').classList.add('hidden');
        document.getElementById('receipt-camera').value = ''; 
        document.getElementById('receipt-upload').value = ''; 
      }
    };

  </script>
</body>
</html>
